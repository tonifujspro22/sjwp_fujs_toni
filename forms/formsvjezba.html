<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="text-align: center">Student registration form</h1>
    <form>
      <label for="roll">Roll no:</label>
      <input type="number" name="roll" id="roll" /> <br />
      <label for="name">Student name:</label>
      <input type="text" name="name" id="name" /> <br />
      <label for="fname">Father's name</label>
      <input type="text" name="fname" id="fname" /> <br />
      <label for="tel">Mobile no.</label>
      <input type="date" name="date" id="date" /> <br />
      <label for="email">Email:</label>
      <input type="email" name="email" id="email" /> <br />
      <label for="pass">Password</label>
      <p>Gender</p>
      <input type="radio" name="spol" id="female" />
      <label for="female">female</label>
      <input type="radio" name="spol" id="male" />
      <label for="male">male</label>
      <p>Department</p>
      <input type="checkbox" name="o1" id="CSE" />
      <label for="CSE">CSE</label>
      <input type="checkbox" name="o2" id="IT" />
      <label for="IT">IT</label>
      <input type="checkbox" name="o3" id="ECE" />
      <label for="ECE">ECE</label>
      <input type="checkbox" name="o4" id="Civil" />
      <label for="Civil">Civil</label>
      <input type="checkbox" name="o5" id="Mech" />
      <label for="Mech">Mech</label><br />
      <label for="curs">Course:</label>
      <select name="curs" id="curs">
        odaberi
      </select>
      <br />
      <label for="file">Student photo</label>
      <input type="file" name="file" id="file" /> <br />
      <label for="city">City</label>
      <input type="text" name="city" id="city" /> <br />
      <label for="adress">adress</label>
      <textarea
        name="adress"
        id="adress"
        ;
        style="height: 100; width: 100"
      ></textarea>
    </form>
  </body>
</html>
