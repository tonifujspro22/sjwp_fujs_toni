<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
      }
      .prvi {
        background-color: blueviolet;
        border: 2px solid black;
        /* širina, vrsta, boja */
        box-sizing: border-box;
        /* border-box zadrzava velicinu tijela */
        padding: 50px 60px;
        /* x y, x - gore i dole, y - lijevo i desno 
        razmak od ruba div-a*/
        margin: 0 auto;
        /* centriranje */
      }
      .drugi {
        background-color: cadetblue;
        margin: 150px 10px 5px 2px;
        /* STAVLJA MARGINE U SMJERU KAZALJKE NA SATU
        margina je udaljenost od ostalih elemenata(razmak) */
        border-radius: 50%;
        /* zaobli uglove */
        border: 3px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="prvi">
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique sunt
        a quasi id deleniti labore repudiandae alias maxime. Ipsa e veniet
        distinctio nulla amet, aliquid non adipisci assumenda omnis commodi
        optio.
      </p>
    </div>
    <div class="drugi"></div>
  </body>
</html>
